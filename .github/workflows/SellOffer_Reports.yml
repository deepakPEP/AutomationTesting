name: SellOffer - Regression Tests

on:
  workflow_dispatch:
  # Uncomment if needed
  # push:
  #   branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: run_tests
        env:
          CI: true
          PHONE_NO: 7538898838
        run: |
          set +e
          mkdir -p artifacts
          npx playwright test \
            --grep @selloffer_flow \
            --reporter=html \
            --output=selloffer-report
          echo $? > artifacts/tests_failed

      - name: Debug report folders
        if: ${{ always() }}
        run: |
          echo "=== WORKSPACE ==="
          pwd
          ls -la

          echo "=== SELLOFFER-REPORT ==="
          if [ -d "selloffer-report" ]; then
            du -sh selloffer-report
            find selloffer-report -type f -print0 | xargs -0 du -h | sort -rh | head -20
          else
            echo "selloffer-report not found"
          fi

          echo "=== TEST-RESULTS ==="
          if [ -d "test-results" ]; then
            du -sh test-results
          else
            echo "test-results not found"
          fi

      - name: Package SellOffer report
        if: ${{ always() }}
        run: |
          set -eux
          rc=$(cat artifacts/tests_failed || echo 1)
          echo "Test exit code: $rc"

          if [ "$rc" -eq 0 ]; then
            if [ -d "selloffer-report" ]; then
              tar -cJf artifacts/selloffer-report.tar.xz \
                --exclude='**/*.webm' \
                --exclude='**/trace.zip' \
                --exclude='**/*.png' \
                --exclude='**/*.jpg' \
                -C . selloffer-report
            else
              tar -cJf artifacts/selloffer-report.tar.xz --files-from /dev/null
            fi
          else
            to_archive=""
            [ -d "selloffer-report" ] && to_archive="$to_archive selloffer-report"
            [ -d "test-results" ] && to_archive="$to_archive test-results"

            if [ -n "$to_archive" ]; then
              tar -cJf artifacts/selloffer-report.tar.xz -C . $to_archive || true
            else
              tar -cJf artifacts/selloffer-report.tar.xz --files-from /dev/null
            fi
          fi

          ls -lh artifacts

      - name: Upload SellOffer report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: selloffer-report
          path: artifacts/*
          retention-days: 30

      - name: Done
        if: ${{ always() }}
        run: echo "SellOffer Playwright report uploaded successfully"
